<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Intro component with sign up form</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div
      class="w-full h-screen flex items-center justify-center text-[var(--fs)] bg-[url('images/bg-intro-desktop.png')] bg-[var(--red)] "
    >
      <div class="flex items-center justify-center w-full">

        <div class="w-[400px] h-full">
          <h1 class="text-white font-extrabold text-4xl">Learn to code by watching others</h1>
          <p class="text-white font-medium text-[12px]">
            See how experienced developers solve problems in real-time. Watching
            scripted tutorials is great, but understanding how developers think
            is invaluable.
          </p>
        </div>

        <main class="w-[400px] h-full flex flex-col">

              <button class="bg-[var(--purple)] p-3 mb-1 rounded-md text-white font-extralight"><span class="font-semibold">Try it free 7 days</span> then $20/mo. thereafter</button>
  

            <div class="p-6 bg-white rounded-md">
              <form action="post" class="flex flex-col">
                <input type="text" placeholder="First Name" class="border-1" />
                <label for="fname"></label><br />
                <input type="text" placeholder="Last Name" class="border-1" />
                <label for="lname"></label><br />
                <input type="email" name="" id="" placeholder="Email Address" class="border-1" />
                <label for="email"></label><br />
                <input type="text" placeholder="Password" class="border-1" />
                <label for="Password"></label><br />
                <button class="border-2 cursor-pointer bg-[var(--green)] text-white">CLAIM YOUR FREE TRIAL</button><br />
              </form>
                <p>
                  By clicking the button, you are agreeing to our
                  <a href="">Terms and Services</a>
                </p>
              </div>
          </main>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
